<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171717'/%3E%3Cpath d='M4 17h6l3-8 5 14 3-6h7' fill='none' stroke='%23ededed' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13h5l2.5-7 4 12 2.5-5H22" /></svg>
        <span><strong>Reliability Monitor</strong><small>Webhooks and APIs</small></span>
      </a>
      <nav>
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/api-tester" class="{% if request.url.path.startswith('/api-tester') %}active{% endif %}">API tester</a>
        <a href="/docs" target="_blank" rel="noopener">API docs</a>
        <span class="nav-label">Exports</span>
        <a href="/exports/events.csv">CSV</a>
        <a href="/exports/events.xlsx">Excel</a>
      </nav>
      <div class="sidebar-footer">
        <span class="status {{ 'status-delivered' if worker_running else 'status-failed' }}">Retry worker {{ 'running' if worker_running else 'stopped' }}</span>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <h1>{% block heading %}{{ app_name }}{% endblock %}</h1>
        <div class="topbar-actions">
          <a class="button secondary" href="/health" target="_blank" rel="noopener">Health</a>
          <button class="button" data-open-modal="endpoint-modal">New endpoint</button>
        </div>
      </header>
      {% block content %}{% endblock %}
    </main>
  </div>

  <dialog id="endpoint-modal" class="modal">
    <form action="/endpoints" method="post" class="modal-card">
      <div class="modal-header">
        <h2>New endpoint</h2>
        <button type="button" class="icon-button" data-close-modal="endpoint-modal" aria-label="Close">×</button>
      </div>
      <div class="form-grid two">
        <label>Name<input name="name" required placeholder="Stripe production"></label>
        <label>Slug<input name="slug" placeholder="stripe-production"></label>
      </div>
      <label>Forward target URL<input type="url" name="target_url" placeholder="https://api.example.com/webhooks"></label>
      <label>Shared secret<input name="signing_secret" placeholder="Checked against the X-Webhook-Secret header"></label>
      <div class="form-grid three">
        <label>Max retries<input type="number" name="max_retries" value="3" min="0" max="10"></label>
        <label>First retry after (s)<input type="number" name="retry_delay_seconds" value="30" min="5"></label>
        <label class="checkbox"><input type="checkbox" name="auto_forward"> Forward automatically</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="button secondary" data-close-modal="endpoint-modal">Cancel</button>
        <button class="button" type="submit">Create endpoint</button>
      </div>
    </form>
  </dialog>
  <script src="{{ url_for('static', path='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
